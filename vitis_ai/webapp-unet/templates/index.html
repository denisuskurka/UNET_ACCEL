<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kria AI Segmentation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .img-container { 
            background: white; 
            padding: 10px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            text-align: center;
        }
        img { max-width: 100%; height: auto; border: 1px solid #ddd; }
        .header { margin-bottom: 30px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>AMD Xilinx Kria KV260</h1>
        <h3>U-Net Segmentation Inference</h3>
    </div>

    <div class="row justify-content-center mb-5">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="formFile" class="form-label">Choose an image to analyze</label>
                            <input class="form-control" type="file" id="formFile" name="file" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Run AI Inference</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    {% if original_image and mask_image %}
    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="img-container">
                <h5>Original Input</h5>
                <img src="{{ original_image }}" alt="Original Image">
            </div>
        </div>
        <div class="col-md-6 mb-3">
            <div class="img-container">
                <h5>AI Prediction (Mask)</h5>
                <img src="{{ mask_image }}" alt="Segmentation Mask">
            </div>
        </div>
    </div>
    <div class="text-center mt-3 mb-5">
        <a href="/" class="btn btn-secondary">Analyze Another Image</a>
    </div>
    {% endif %}
</div>

</body>
</html>
